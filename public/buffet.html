<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Buffet 兌換｜2026 台灣普利司通經銷商年度大會</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/me.css">
  <link rel="stylesheet" href="/css/buffet.css">
</head>
<body class="inner-bg">
  <div class="topbar">
    <img class="logo" src="/assets/logo.png" width="1232" height="153" alt="BRIDGESTONE">
  </div>

  <main class="wrap" aria-live="polite">
    <header class="buffet-head">
      <p class="promo-tag">BUFFET</p>
      <h1>Buffet 兌換</h1>
    </header>

    <div class="card center" id="loading"><p class="muted">載入中…</p></div>

    <!-- 輸入姓名 -->
    <section class="card" id="stepSearch" hidden>
      <h2 class="card-title">請輸入您的姓名</h2>
      <p class="muted small" style="margin-top:0">查詢後即可顯示您的 Buffet 兌換券。</p>
      <form id="searchForm" novalidate autocomplete="off">
        <label class="field">
          <span class="sr-only">姓名</span>
          <input class="input" id="nameInput" type="text" maxlength="50" enterkeyhint="search" placeholder="例如：王小明">
        </label>
        <div class="alert error" id="searchErr" role="alert" hidden></div>
        <button class="btn block" id="searchBtn" type="submit">查詢</button>
      </form>
    </section>

    <!-- 同名選店 -->
    <section class="card" id="stepChoose" hidden>
      <h2 class="card-title">請選擇您的店名</h2>
      <p class="muted small" style="margin-top:0">有多位「<strong id="chooseName"></strong>」，請點選您所屬的店家。</p>
      <div id="chooseList"></div>
      <button class="btn ghost block" type="button" data-back>重新輸入姓名</button>
    </section>

    <!-- 查無資料 / 尚未報到 -->
    <section class="card center" id="stepMsg" hidden>
      <h2 class="card-title" style="justify-content:center" id="msgTitle"></h2>
      <p id="msgText"></p>
      <div class="stack">
        <a class="btn block" id="msgGo" href="/" hidden>前往報到</a>
        <button class="btn ghost block" type="button" data-back>重新輸入姓名</button>
      </div>
    </section>

    <!-- 兌換券 -->
    <section id="stepCoupon" hidden>
      <div class="card who">
        <div>
          <p class="who-name" id="cName"></p>
          <p class="muted" style="margin:0" id="cStore"></p>
        </div>
        <button class="btn ghost small" type="button" id="notMe">不是我</button>
      </div>
      <div class="card" id="couponCard">
        <h2 class="card-title">Buffet 兌換券</h2>
        <div id="couponBody"></div>
      </div>
      <a class="btn ghost block" id="myPage" href="/me">查看我的報到資訊</a>
    </section>

    <p class="event-sub center">2026 Bridgestone Dealer Convention</p>
  </main>
  <div class="footer-strip" aria-hidden="true"></div>

  <script src="/vendor/qrcode.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/coupon.js"></script>
  <script src="/js/buffet.js"></script>
</body>
</html>
